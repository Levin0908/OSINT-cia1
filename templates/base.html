<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}OSINT Phishing Investigator{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E" />
</head>
<body>
    <nav class="navbar">
        <div class="brand">
            <span class="brand-icon">&#x1F6E1;</span>
            <span class="brand-text">OSINT Phishing Investigator</span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">Dashboard</a>
            <a href="/investigate" class="nav-link">Investigate</a>
            <a href="/history" class="nav-link">History</a>
            <a href="/docs" class="nav-link" target="_blank">API</a>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <span>Ethical OSINT only &middot; data collected from public sources</span>
        <span>v1.0.0</span>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
